name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPRESS: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            ccache \
            cmake \
            libboost-all-dev \
            libeigen3-dev \
            libopenmpi-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: >-
            ccache-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Reset cache statistics
        run: ccache --zero-stats

      - name: Build and run quick tests
        run: bash ./build_and_test.sh --quick

      - name: Show cache statistics
        if: always()
        run: ccache --show-stats