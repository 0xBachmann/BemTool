name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow_tests:
        description: "Run the complete suite, including slow tests"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Linux / GCC
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            libboost-all-dev \
            libeigen3-dev \
            libopenmpi-dev

      - name: Run quick test suite
        run: bash ./build_and_test.sh --all